name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Runs first and independently: AGPL anywhere in the dependency path
      # disqualifies the SCF grant, so this gates everything else.
      - name: Licence gate
        run: npm run licence

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
